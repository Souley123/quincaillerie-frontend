name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main, master]
    paths:
      - 'quincaillerie-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quincaillerie-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quincaillerie-frontend/package-lock.json
      - name: Install dependencies
        # --legacy-peer-deps : react-scripts 5 déclare des contraintes de pairs
        # que npm ci (strict) refuse, alors que npm install les tolère. Sans
        # cette option, l'installation échoue et le site n'est jamais publié.
        run: npm ci --legacy-peer-deps
      - name: Verifier que tous les modules importes sont versionnes
        # Un fichier present en local mais non committe (git add) n'arrive pas
        # sur GitHub : react-scripts echoue alors avec
        # « Module not found: Error: Can't resolve './services/xxx' ».
        # Ce controle liste les imports relatifs introuvables AVANT le build,
        # pour nommer precisement le(s) fichier(s) a ajouter au depot.
        run: |
          node -e "
          const fs=require('fs'),path=require('path');
          const src=path.join(process.cwd(),'src');
          const fichiers=[];
          const parcourir=d=>fs.readdirSync(d,{withFileTypes:true}).forEach(e=>{const p=path.join(d,e.name);e.isDirectory()?parcourir(p):fichiers.push(p)});
          parcourir(src);
          const js=fichiers.filter(f=>/\.(js|jsx|ts|tsx)$/.test(f));
          const manquants=[];
          for(const f of js){
            const contenu=fs.readFileSync(f,'utf8');
            const re=/(?:import[^;]*?from\s*|require\(\s*)['\"](\.[^'\"]+)['\"]/g;
            let m;
            while((m=re.exec(contenu))){
              const base=path.resolve(path.dirname(f),m[1]);
              const ok=['','.js','.jsx','.ts','.tsx','/index.js','/index.jsx','/index.ts','/index.tsx'].some(s=>fs.existsSync(base+s));
              if(!ok) manquants.push(path.relative(src,f)+'  ->  '+m[1]);
            }
          }
          if(manquants.length){
            console.error('MODULES INTROUVABLES (fichier absent du depot) :');
            manquants.forEach(x=>console.error('  - '+x));
            console.error('Correctif : git add des fichiers concernes puis commit + push.');
            process.exit(1);
          }
          console.log('Tous les imports relatifs de src/ sont presents.');
          "
      - name: Build frontend
        run: npm run build
        env:
          # URL publique du backend. La variable de dépôt REACT_APP_API_URL
          # (Settings → Secrets and variables → Actions → Variables) la
          # remplace si elle est définie ; sinon la valeur par défaut ci-dessous
          # pointe vers l'API Render publique.
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://gestion-de-stocks-5lv3.onrender.com' }}
      - name: Deploy to GitHub Pages (branche gh-pages)
        # La source GitHub Pages de ce depot est « Deploy from a branch »
        # (branche gh-pages). On publie donc directement sur cette branche :
        # actions/deploy-pages exigerait la source « GitHub Actions » et
        # echouerait, ce qui figeait le site sur une ancienne version.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: quincaillerie-frontend/build
          publish_branch: gh-pages
          force_orphan: true
