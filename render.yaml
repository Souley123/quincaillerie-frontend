# Le nom ci-dessous doit correspondre EXACTEMENT au service Render qui sert
# l'API, sinon Render en crée un second (ou pointe dans le vide) au lieu de
# mettre à jour celui qui est en ligne.
# NB : le service RÉELLEMENT en ligne s'appelle « gestion-de-stock-ae8a ».
# Le nom « skys-erp-api » n'existe PAS sur Render (toutes ses URL renvoient 404).
services:
  - type: web
    name: gestion-de-stock-ae8a
    runtime: node
    plan: starter            # plan payant : pas de mise en veille, meilleure sécurité
    region: frankfurt        # région la plus proche de la Côte d'Ivoire (latence minimale)
    rootDir: quicaillerie-backend
    # npm install (et non npm ci) : tolerant aux ecarts de lockfile, comme le
    # workflow frontend deja valide. npm ci strict echouait et bloquait le
    # deploiement -> le service restait sur une ancienne build.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: '1.0.0'
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_DUREE
        value: 12h
      # URL HTTPS publique du frontend (liens de réinitialisation par email)
      - key: APP_URL
        value: https://souley123.github.io
      # Origines autorisées à appeler l'API (séparées par des virgules)
      - key: CORS_ORIGINS
        value: https://souley123.github.io,http://localhost:3000,http://127.0.0.1:3000
      # Taille maximale du corps JSON reçu
      - key: JSON_LIMIT
        value: 1mb
      # ---------- PAIEMENTS KKIAPAY (secrets : sync: false) ----------
      # La clé publique peut être exposée au frontend ; les deux autres NON.
      - key: KKIAPAY_PUBLIC
        sync: false
      - key: KKIAPAY_PRIVATE
        sync: false
      - key: KKIAPAY_SECRET
        sync: false
      - key: KKIAPAY_BASE_URL
        value: https://api.kkiapay.me
      # ---------- NOTIFICATIONS (optionnel) ----------
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      # Gmail : 465 = TLS implicite (SMTP_SECURE=true), 587 = STARTTLS (false).
      # 587/false est la combinaison verifiee sur ce compte d'envoi : le port
      # 465 peut etre filtre par certains reseaux (ETIMEDOUT a l'envoi).
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # ---------- COMPTE DE TEST / ESSAI (3 JOURS) ----------
      # DEMO_COMPTE=actif crée un compte de test prêt à l'emploi ; l'accès est
      # coupé automatiquement à l'échéance (DEMO_DUREE_JOURS).
      - key: DEMO_COMPTE
        value: actif
      - key: DEMO_EMAIL
        value: demo@skys-erp.com
      - key: DEMO_MOT_DE_PASSE
        sync: false
      - key: DEMO_SLUG
        value: demo
      - key: DEMO_DUREE_JOURS
        value: '3'
      # Durée de l'essai gratuit des nouvelles inscriptions (jours).
      - key: ESSAI_JOURS
        value: '3'
