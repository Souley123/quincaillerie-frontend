# Le nom ci-dessous doit correspondre EXACTEMENT au service Render qui sert
# l'API, sinon Render en crée un second (ou pointe dans le vide) au lieu de
# mettre à jour celui qui est en ligne.
# NB : le service RÉELLEMENT en ligne s'appelle « gestion-de-stocks-5lv3 »
#   (URL : https://gestion-de-stocks-5lv3.onrender.com — vérifié le 2026-10-16 :
#    /health = 200, base connectée).
# L'ancien service « gestion-de-stock-ae8a » renvoie 503 : ne plus l'utiliser.
# Le nom « skys-erp-api » n'existe PAS sur Render (toutes ses URL renvoient 404).
services:
  - type: web
    name: gestion-de-stocks-5lv3
    runtime: node
    plan: starter            # plan payant : pas de mise en veille, meilleure sécurité
    region: frankfurt        # région la plus proche de la Côte d'Ivoire (latence minimale)
    rootDir: quicaillerie-backend
    # npm install (et non npm ci) : tolerant aux ecarts de lockfile, comme le
    # workflow frontend deja valide. npm ci strict echouait et bloquait le
    # deploiement -> le service restait sur une ancienne build.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: '1.0.0'
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_DUREE
        value: 12h
      # URL HTTPS exacte du frontend GitHub Pages (liens de réinitialisation).
      # Le sous-chemin est nécessaire pour que le lien ouvre bien l'application.
      - key: APP_URL
        value: https://souley123.github.io/quincaillerie-frontend
      # Seul le frontend publié est autorisé à appeler l'API en production.
      # Pour le développement local, définir CORS_ORIGINS dans l'environnement local.
      - key: CORS_ORIGINS
        value: https://souley123.github.io
      # Swagger expose la surface d'API : garder désactivé en production.
      - key: SWAGGER_ACTIF
        value: 'false'
      # Taille maximale du corps JSON reçu
      - key: JSON_LIMIT
        value: 1mb
      # ---------- PAIEMENTS KKIAPAY (secrets : sync: false) ----------
      # La clé publique peut être exposée au frontend ; les deux autres NON.
      - key: KKIAPAY_PUBLIC
        sync: false
      - key: KKIAPAY_PRIVATE
        sync: false
      - key: KKIAPAY_SECRET
        sync: false
      - key: KKIAPAY_BASE_URL
        value: https://api.kkiapay.me
      # ---------- EMAILS REELS (API HTTPS Brevo) ----------
      # A remplir dans Render Dashboard > Environment avec la clé privée.
      # Le déploiement ne peut pas envoyer de vrais e-mails sans une vraie clé.
      - key: BREVO_API_KEY
        sync: false
      # Adresse vérifiée comme expéditeur dans le compte Brevo.
      - key: SMTP_FROM
        sync: false
      # SMTP est gardé uniquement pour un hébergement qui autorise explicitement
      # les connexions SMTP sortantes. Render gratuit les bloque.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: DIAG_TOKEN
        sync: false
      - key: DIAG_EMAIL_TEST_TO
        sync: false
      # ---------- NOTIFICATIONS (optionnel) ----------
      - key: ADMIN_EMAIL
        sync: false
      # Durée de l'essai gratuit des nouvelles inscriptions (jours).
      - key: ESSAI_JOURS
        value: '3'
