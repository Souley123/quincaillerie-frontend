name: Deploy frontend to GitHub Pages
on:
  # Le workflow canonique est à la racine du dépôt; conserver ici uniquement
  # un déclenchement manuel évite deux publications concurrentes de gh-pages.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quincaillerie-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: quincaillerie-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.REACT_APP_API_URL || 'https://gestion-de-stocks-5lv3.onrender.com' }}
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://gestion-de-stocks-5lv3.onrender.com' }}
      - name: Deploy to GitHub Pages (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: quincaillerie-frontend/dist
          publish_branch: gh-pages
          force_orphan: true
