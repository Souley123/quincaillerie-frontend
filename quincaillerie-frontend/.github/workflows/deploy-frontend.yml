name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main, master]
    paths:
      - 'quincaillerie-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quincaillerie-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quincaillerie-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          # URL publique du backend. La variable de dépôt REACT_APP_API_URL
          # (Settings → Secrets and variables → Actions → Variables) la
          # remplace si elle est définie ; sinon la valeur par défaut ci-dessous
          # pointe vers l'API Render publique.
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://gestion-de-stock-ae8a.onrender.com' }}
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quincaillerie-frontend/build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
