<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 92" width="340" height="92" role="img" aria-label="SKYS ERP Solution">
  <!--
    LOGO SKYS ERP SOLUTION — VECTORIEL, FOND TRANSPARENT
    =====================================================
    VARIANTE CLAIRE, pour fonds SOMBRES (panneau de présentation de la
    connexion ordinateur) : mot-symbole blanc + bleu ciel, lisible sur le
    dégradé marine. En bleu marine il disparaissait sur ce panneau.

    Dessin, viewBox et proportions STRICTEMENT identiques à `logo-skys.svg` :
    seule la couleur du mot-symbole change. Explication complète dans ce
    dernier (remplacement de la photo matricielle et de son fond noir).
  -->
  <defs>
    <linearGradient id="orbe" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="0.45" stop-color="#1D7FD0" />
      <stop offset="1" stop-color="#0A3F7A" />
    </linearGradient>
    <linearGradient id="ruban" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#F8FAFC" />
      <stop offset="0.5" stop-color="#CBD5E1" />
      <stop offset="1" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="barre" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0EA5E9" />
      <stop offset="1" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="mot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- ================= EMBLÈME ================= -->
  <g id="embleme" transform="translate(4 2) scale(0.5)">
    <!-- Orbe bleu -->
    <circle cx="72" cy="82" r="62" fill="url(#orbe)" />
    <!-- Rubans argentés qui ceinturent l'orbe -->
    <path d="M6 92C6 46 34 10 70 3c28-6 54 5 71 24-15-13-36-18-57-11C57 25 34 52 32 88c-1 15 2 28 9 39C22 118 11 107 6 92z"
          fill="url(#ruban)" opacity="0.92" />
    <path d="M136 56c11 13 15 28 11 43-6 26-34 47-68 49-19 1-36-5-49-14 13 5 30 6 47 3 32-7 56-35 59-81z"
          fill="url(#ruban)" opacity="0.85" />
    <!-- Barres de croissance -->
    <rect x="46" y="86" width="16" height="34" rx="3" fill="url(#barre)" />
    <rect x="69" y="72" width="16" height="48" rx="3" fill="url(#barre)" />
    <rect x="92" y="55" width="16" height="65" rx="3" fill="url(#barre)" />
    <!-- Flèche de croissance -->
    <path d="M38 104c11-19 28-32 50-38l-4-17 36 19-32 25 1-17c-19 6-34 17-44 32z" fill="#FFFFFF" />
    <!-- Étincelle -->
    <path d="M118 18l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#E2E8F0" />
  </g>

  <!-- ================= MOT-SYMBOLE ================= -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
    <text x="86" y="52" font-size="44" font-weight="700" letter-spacing="0.5" fill="url(#mot)">SKYS<tspan dx="9" fill="#38BDF8">ERP</tspan></text>

    <!-- Filet gauche + « SOLUTION » centré + filet droit -->
    <rect x="87" y="61" width="47" height="2" rx="1" fill="#7DD3FC" opacity="0.75" />
    <text x="177.5" y="72" font-size="15" font-weight="700" letter-spacing="4.6" fill="#38BDF8" text-anchor="middle">SOLUTION</text>
    <rect x="221" y="61" width="47" height="2" rx="1" fill="#7DD3FC" opacity="0.75" />
  </g>
</svg>
