<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="SKYS ERP Solution">
  <!--
    LOGO SKYS ERP — VECTORIEL (aucun flou)

    Pourquoi un SVG et pas la photo `logo.png.jpeg` ?
      - le fichier fourni a un FOND NOIR OPAQUE : sur la carte blanche, il
        formait un rectangle noir ;
      - c'est une image matricielle : réduite à 44 px de haut, le texte
        « ERP » et le dégradé devenaient brouillés.

    Ce SVG reprend l'emblème officiel (globe bleu + barres de croissance +
    flèche blanche) et le mot-symbole, en trois couleurs solides : net à
    n'importe quelle taille et à n'importe quel DPI (Android xxhdpi, Retina).
  -->
  <!--
    VARIANTE CLAIRE — pour fonds SOMBRES (panneau de connexion ordinateur).
    Le mot-symbole passe en blanc et en bleu ciel : en bleu foncé sur le
    dégradé marine, il était quasi illisible (constaté sur écran 1920 px).
    L'emblème, lui, garde ses bleus : sur fond sombre il reste bien détaché.
  -->
  <!--
    Emblème agrandi (r≈40 au lieu de 30) : à 56 px de haut, le globe
    précédent ne faisait plus que 40 px de diamètre et se perdait dans le
    panneau. Le mot-symbole est lui aussi proportionnellement plus grand.
  -->
  <g id="embleme" transform="translate(8 4) scale(1.32)">
    <!-- Globe / orbe : deux croissants bleus qui se croisent -->
    <circle cx="46" cy="48" r="30" fill="#0B5FA5" />
    <path d="M12 40c6-20 24-32 44-28 11 2 20 9 25 19-9-8-20-12-32-11-16 1-29 9-37 20z" fill="#1E88D8" opacity="0.95" />
    <path d="M80 56c-6 20-24 32-44 28-11-2-20-9-25-19 9 8 20 12 32 11 16-1 29-9 37-20z" fill="#0A4C85" />

    <!-- Barres de croissance -->
    <rect x="30" y="48" width="7" height="14" rx="1.5" fill="#FFFFFF" />
    <rect x="41" y="40" width="7" height="22" rx="1.5" fill="#FFFFFF" />
    <rect x="52" y="32" width="7" height="30" rx="1.5" fill="#FFFFFF" />

    <!-- Flèche ascendante -->
    <path d="M28 34l10-12 9 8 8-10 6 5-13 17-8-8-7 9z" fill="#FFFFFF" opacity="0.98" />
    <circle cx="40" cy="16" r="2.4" fill="#FFFFFF" />
  </g>

  <!-- Mot-symbole : SKYS en grand, ERP en bleu ciel, SOLUTION en petites
       capitales. Taille augmentée pour rester lisible sur grand écran. -->
  <text x="120" y="66" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="42" font-weight="700" letter-spacing="2" fill="#FFFFFF">SKYS</text>
  <text x="122" y="96" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="21" font-weight="700" letter-spacing="9.5" fill="#38BDF8">ERP</text>
  <text x="226" y="96" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="600" letter-spacing="3" fill="#A9C4DC">SOLUTION</text>
</svg>
